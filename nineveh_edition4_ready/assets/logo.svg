<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="30%" stop-color="#F8B500"/>
      <stop offset="70%" stop-color="#DDAC17"/>
      <stop offset="100%" stop-color="#967207"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A7"/>
      <stop offset="50%" stop-color="#E5BB43"/>
      <stop offset="100%" stop-color="#AA8014"/>
    </linearGradient>
  </defs>

  <!-- Main Statue & Circular Reel Emblem -->
  <g transform="translate(300, 240) scale(0.85)">
    <!-- Outer Film Reel Circle -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="url(#goldGrad)" stroke-width="9"/>
    <circle cx="0" cy="0" r="278" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8,6"/>
    <circle cx="0" cy="0" r="242" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Film Reel Perforations -->
    <g stroke="url(#goldGrad)" stroke-width="3" fill="none">
      <path d="M 0,-270 L 0,-250 M 46,-265 L 42,-245 M 90,-252 L 83,-232 M 134,-230 L 124,-211 M 172,-204 L 160,-186 M 204,-172 L 186,-160 M 230,-134 L 211,-124 M 252,-90 L 232,-83 M 265,-46 L 245,-42 M 270,0 L 250,0 M 265,46 L 245,42 M 252,90 L 232,83 M 230,134 L 211,124 M 204,172 L 186,160 M 172,204 L 160,186 M 134,230 L 124,211 M 90,252 L 83,232 M 46,265 L 42,245 M 0,270 L 0,250 M -46,265 L -42,245 M -90,252 L -83,232 M -134,230 L -124,211 M -172,204 L -160,186 M -204,172 L -186,160 M -230,134 L -211,124 M -252,90 L -232,83 M -265,46 L -245,42 M -270,0 L -250,0 M -265,-46 L -245,-42 M -252,-90 L -232,-83 M -230,-134 L -211,-124 M -204,-172 L -186,-160 M -172,-204 L -160,-186 M -134,-230 L -124,-211 M -90,-252 L -83,-232 M -46,-265 L -42,-245"/>
    </g>

    <!-- Nineveh Goddess Statue -->
    <g fill="url(#goldGrad)">
      <path d="M -25,-80 C -80,-180 -180,-250 -260,-190 C -240,-120 -190,-70 -120,-30 C -180,-40 -230,-10 -240,40 C -190,20 -140,20 -80,10 C -140,40 -190,90 -170,140 C -130,110 -80,80 -30,50 Z"/>
      <path d="M -40,-110 C -90,-190 -180,-230 -230,-180 C -200,-130 -150,-90 -90,-60 Z" opacity="0.8"/>
      <path d="M 25,-80 C 80,-180 180,-250 260,-190 C 240,-120 190,-70 120,-30 C 180,-40 230,-10 240,40 C 190,20 140,20 80,10 C 140,40 190,90 170,140 C 130,110 80,80 30,50 Z"/>
      <path d="M 40,-110 C 90,-190 180,-230 230,-180 C 200,-130 150,-90 90,-60 Z" opacity="0.8"/>

      <circle cx="0" cy="-140" r="16" fill="url(#goldLight)"/>
      <path d="M -15,-155 Q 0,-180 15,-155 Q 0,-165 -15,-155 Z" fill="url(#goldLight)"/>
      <path d="M -15,-120 C -25,-90 -35,-40 -20,0 C -40,-30 -60,-50 -80,-60 C -60,-30 -30,-10 -15,-5 L -10,60 C -25,120 -35,180 -40,230 L 40,230 C 35,180 25,120 10,60 L 15,-5 C 30,-10 60,-30 80,-60 C 60,-50 40,-30 20,0 C 35,-40 25,-90 15,-120 Z"/>
      
      <path d="M -50,-10 C 0,20 50,40 60,80 C 70,120 -10,140 -50,170 C -70,190 -20,220 50,230" fill="none" stroke="url(#goldLight)" stroke-width="14"/>
      <path d="M -50,-10 C 0,20 50,40 60,80 C 70,120 -10,140 -50,170 C -70,190 -20,220 50,230" fill="none" stroke="#2B0C0E" stroke-width="7" stroke-dasharray="5,5"/>
    </g>
  </g>

  <!-- Typography at Bottom (Updated to الدورة الثانية) -->
  <text x="300" y="520" font-family="'Tajawal', 'Cairo', 'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">
    مهرجان نينوى السينمائي الدولي - الدورة الثانية
  </text>
  <text x="300" y="560" font-family="'Cinzel', 'Montserrat', serif" font-size="18" font-weight="600" fill="url(#goldLight)" text-anchor="middle" letter-spacing="3">
    NINEVEH INTERNATIONAL FILM FESTIVAL
  </text>
  <text x="300" y="595" font-family="'Cinzel', 'Montserrat', serif" font-size="13" font-weight="500" fill="#DDAC17" text-anchor="middle" letter-spacing="5">
    - 2ND EDITION -
  </text>
</svg>
